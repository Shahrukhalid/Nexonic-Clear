[package]
name = "clear-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline image metadata and Content Credentials inspection and removal"

[features]
default = ["c2pa"]
c2pa = ["dep:c2pa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto"], optional = true }

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto"] }
