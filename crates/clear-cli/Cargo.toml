[package]
name = "clear-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nexonic Clear command-line tool: inspect and remove metadata with verification"

[[bin]]
name = "nexonic-clear-cli"
path = "src/main.rs"

[dependencies]
clear-core = { path = "../clear-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
